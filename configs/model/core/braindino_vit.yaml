_pretrain_net:
  _target_: asparagus.modules.networks.spacing_aware_vit.${model.pretrain_net}
  patch_kernel_size: ${model.patch_kernel_size}
  patch_stride: ${model.patch_stride}
  patch_padding: ${model.patch_padding}
  init_sigma_mm: ${model.init_sigma_mm}
  learn_sigma: ${model.learn_sigma}
  cls_projection_dim: ${model.cls_projection_dim}
  patch_projection_dim: ${model.patch_projection_dim}

_seg_net:
  _target_: asparagus.modules.networks.spacing_aware_vit.${model.seg_net}

_cls_net:
  _target_: asparagus.modules.networks.spacing_aware_vit.${model.cls_net}
  dropout_op_kwargs:
    encoder_dropout_rate: ${model.encoder_dropout_rate}
    decoder_dropout_rate: ${model.decoder_dropout_rate}
    inplace: true

_plugin_seg_net:
  _target_: asparagus.modules.networks.spacing_aware_vit.${model.plugin_seg_net}
  dimensions: ${model.dimensions}

recovery_ckpt_every_n_optimizer_steps: 1000
snapshot_ckpt_every_n_optimizer_steps: 10000

pretrain_optim: AdamW
pretrain_lr: 1.0e-4
weight_decay: 0.01

warmup_ratio: 0.05
cosine_period_ratio: 1.0
minimum_lr: 1.0e-6

train_optim: SGD
train_lr: 1e-2
nesterov: True
momentum: 0.99

finetune_optim: AdamW
finetune_lr: 1e-3
