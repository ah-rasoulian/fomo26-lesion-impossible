defaults:
  - core/base@
  - hardware/1gpu12cpu@hardware
  - _self_

task:
checkpoint_run_id:
load_checkpoint_name:
hf_model_id:
root: base
stem: ${checkpoint_run_id}_${load_checkpoint_name}

model:
  net:

  cls_hidden_dim: 256
  cls_dropout: 0.1
  cls_top_k_fraction: 0.001
  cls_min_top_k: 16
  cls_token_logit_weight: 1.0
  reg_hidden_dim: 256
  reg_dropout: 0.1
  reg_cls_weight: 0.8

lightning:
  data_module:
  lightning_module:

data:
  data_path: ${oc.env:ASPARAGUS_DATA}/${task}
  train_split: split_95_05_00
  fold: 4

training:
  resume_ckpt:
  refit_full_data: false
  epochs: 200
  batch_size: 2
  accumulate_grad_batches: 2
  seed: 1998
  samples_per_epoch: 128
  steps_per_epoch: ${ceil_div:${training.samples_per_epoch},${training.batch_size}}
  val_steps_per_epoch: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  use_weighted_sampler: true
  weighted_sampler_power: 1.0
  label_smoothing: 0.0

optimization:
  enabled: false
  result_path:

transforms:
  cpu_tr_transforms: CPU_vit_train_transforms
  cpu_val_transforms: CPU_vit_val_test_transforms
  gpu_tr_transforms: GPU_vit_all_train_transforms
  gpu_val_transforms:
  normalize: true
  center_crop_fraction: 0.9

logger:
  progress_bar: true
  profile: false
  wandb_log_model: false
  wandb_logging: true
  wandb_entity: ah-rasoulian-neurorx
  wandb_project: Finetune-ViT-V3
  mlflow_logging: false
  log_every_n_steps: 10
  log_images_every_n_epoch: 5
  log_to_stdout: true
