defaults:
  - core/base@
  - hardware/1gpu12cpu@hardware
  - _self_

task:
checkpoint_run_id:
load_checkpoint_name: last.ckpt
hf_model_id:
root: base
stem: ${checkpoint_run_id}_${load_checkpoint_name}

# Each task config selects its own network, Lightning module, and data module.
model:
  net:

lightning:
  data_module:
  lightning_module:

data:
  data_path: ${oc.env:ASPARAGUS_DATA}/${task}
  train_split: split_80_20_00
  fold: 0

training:
  resume_ckpt:
  epochs: 100
  batch_size: 1
  seed: 1998
  steps_per_epoch: 100
  samples_per_epoch: ${eval:"${training.steps_per_epoch} * ${training.batch_size}"}
  val_steps_per_epoch: 1.0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  use_weighted_sampler: false
  weighted_sampler_power: 1.0
  label_smoothing: 0.0

transforms:
  cpu_tr_transforms: braindino_CPU_train_transforms
  cpu_val_transforms: braindino_CPU_val_transforms
  gpu_tr_transforms: GPU_vit_all_train_transforms
  gpu_val_transforms:
  normalize: true
  center_crop_fraction: 0.8
  flip_probability: 0.5
  rotation_degrees: 5.0
  scale_range: [0.97, 1.03]
  affine_probability: 0.2
  noise_probability: 0.1
  bias_field_probability: 0.1
  gamma_probability: 0.1
  blur_probability: 0.0
  elastic_probability: 0.0

logger:
  progress_bar: true
  profile: false
  wandb_log_model: false
  wandb_logging: true
  wandb_entity: ah-rasoulian-neurorx
  wandb_project: Finetune-ViT
  mlflow_logging: false
  log_every_n_steps: 10
  log_images_every_n_epoch: 1
  log_to_stdout: true
