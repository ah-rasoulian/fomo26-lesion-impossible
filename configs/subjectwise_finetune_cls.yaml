defaults:
  - core/base@
  - hardware/1gpu12cpu@hardware
  - _self_

task:
checkpoint_run_id:
load_checkpoint_name: last.ckpt
hf_model_id:
root: base
stem: ${checkpoint_run_id}_${load_checkpoint_name}

model:
  net: ${model.cls_net}
  freeze_backbone: False

lightning:
  data_module: ClsRegDataModule
  lightning_module: ViTClassificationModule

data:
  data_path: ${oc.env:ASPARAGUS_DATA}/${task}
  train_split: split_80_20_00
  fold: 0

training:
  epochs: 100
  warmup_epochs:
  batch_size: 1
  seed: 1998

  steps_per_epoch: 250
  val_steps_per_epoch: 1.0

  target_size: [ 128, 128, 128 ]
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 32

  use_class_weights: true
  class_weight_power: 0.5
  label_smoothing: 0.0

transforms:
  cpu_tr_transforms: CPU_vit_train_transforms
  cpu_val_transforms: CPU_vit_val_test_transforms
  gpu_tr_transforms: GPU_all_train_transforms
  gpu_val_transforms:
  normalize: True

logger:
  progress_bar: True
  profile: False
  wandb_log_model: False
  wandb_logging: True
  wandb_entity: ah-rasoulian-neurorx
  wandb_project: Finetune-ViT
  mlflow_logging: False
  log_every_n_steps: 10
  log_images_every_n_epoch: 1
  log_to_stdout: True
