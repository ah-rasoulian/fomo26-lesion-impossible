defaults:
  - core/base@
  - hardware/1gpu40cpu@hardware
  - _self_

task:
checkpoint_run_id:
load_checkpoint_name: last.ckpt
hf_model_id:
root: base
stem: ${checkpoint_run_id}_${load_checkpoint_name}

model:
  net: ${model.cls_net}
  ckpt_every_n_epoch: 25

lightning:
  data_module: ClsRegDataModule
  lightning_module: ViTClassificationModule

data:
  data_path: ${oc.env:ASPARAGUS_DATA}/${task}
  train_split: split_75_25_00
  fold: 0

training:
  epochs: 50
  warmup_epochs:
  batch_size: 1
  limit_train_batches: 250
  limit_val_batches: 50
  target_size: [128, 128, 128]
  seed: ${random:0,1000000}
  check_val_every_n_epoch: 3
  accumulate_grad_batches: 1

transforms:
  cpu_tr_transforms: CPU_vit_train_transforms
  cpu_val_transforms: CPU_vit_val_test_transforms
  gpu_tr_transforms: GPU_all_train_transforms
  gpu_val_transforms:
  normalize: True

logger:
  progress_bar: True
  profile: False
  wandb_log_model: False
  wandb_logging: True
  wandb_entity: ah-rasoulian-neurorx
  wandb_project: Finetune-ViT
  mlflow_logging: False
  log_every_n_steps: 10
  log_images_every_n_epoch: 1
  log_to_stdout: True
